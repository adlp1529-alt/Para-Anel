<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Anel… ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5efe5;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(520px,100%);background:#111;border:1px solid #b99555;border-radius:22px;padding:34px 24px;box-shadow:0 18px 60px #000}
h1{font-size:42px;font-weight:normal;text-align:center;margin:0 0 10px;color:#d7b16a}
.subtitle{text-align:center;font-style:italic;line-height:1.6;color:#ddd;margin:0 auto 28px;max-width:410px}
.song{display:block;text-decoration:none;color:#f5efe5;border:1px solid #6f5833;border-radius:15px;padding:17px 18px;margin:12px 0;background:#171717;transition:.2s}
.song:hover{transform:translateY(-2px);border-color:#d7b16a}
.num{color:#d7b16a;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.name{display:block;font-size:20px;margin-top:5px}
.note{text-align:center;color:#aaa;font-size:14px;line-height:1.6;margin-top:28px}
.heart{text-align:center;color:#d7b16a;font-size:25px;margin:8px}
</style>
</head>
<body>
<main class="card">
  <div class="heart">♡</div>
  <h1>Para Anel…</h1>
  <p class="subtitle">Tres canciones que hice pensando en ti.<br>Escúchalas cuando estés sola.</p>
  <a class="song" href="https://suno.com/s/mCw4nC2tKKhA2PV8" target="_blank" rel="noopener"><span class="num">Canción 1</span><span class="name">Canción 1 ♪</span></a><a class="song" href="https://suno.com/s/CijRbRai7yPgddx9" target="_blank" rel="noopener"><span class="num">Canción 2</span><span class="name">Canción 2 ♪</span></a><a class="song" href="https://suno.com/s/c9o62i4fpMVMGs5e" target="_blank" rel="noopener"><span class="num">Canción 3</span><span class="name">Canción 3 ♪</span></a>
  <p class="note">No tienes que responderme nada.<br>Solo quería que escucharas lo que alguna vez sentí y no siempre supe decirte.</p>
  <div class="heart">♥</div>
</main>
</body>
</html>
